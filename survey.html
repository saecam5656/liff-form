<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アンケート回答</title>
</head>
<body>
    <p id="status">読み込み中...</p>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        async function main() {
            const statusEl = document.getElementById('status');
            try {
                // LIFF初期化
                await liff.init({ liffId: "2009477976-kLspdySF" });
                statusEl.innerText = "LINE認証中...";

                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    const lineName = encodeURIComponent(profile.displayName);
                    
                    // 修正版URL
                    const formUrl = "https://docs.google.com/forms/d/19S6jkaNR8h8_luTd_SckN2H48TTsMo-w4EO-v-nxN84/viewform?usp=pp_url&entry.104920594=" + lineName;
                    
                    statusEl.innerText = "フォームへ移動します...";
                    window.location.href = formUrl;
                }
            } catch (error) {
                statusEl.innerText = "エラーが発生しました: " + error.message;
                console.error(error);
            }
        }
        main();
    </script>
</body>
</html>
